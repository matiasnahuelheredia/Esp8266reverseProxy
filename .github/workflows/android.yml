name: App Android

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Compilar APK
        working-directory: android
        env:
          APP_VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease
      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk esp-proxy-config.apk
      - uses: actions/upload-artifact@v5
        with:
          name: esp-proxy-config-apk
          path: esp-proxy-config.apk
      - name: Publicar en el Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: esp-proxy-config.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
