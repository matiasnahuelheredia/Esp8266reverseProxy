name: Firmware ESP32

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar
        run: pio run -d firmware 
      - name: Renombrar binario
        run: cp firmware/.pio/build/esp32dev/firmware.bin esp32-reverse-proxy.bin
      - uses: actions/upload-artifact@v5
        with:
          name: esp32-reverse-proxy
          path: esp32-reverse-proxy.bin
      - name: Publicar en el Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: esp32-reverse-proxy.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-latest:
    # Cada push a main actualiza el release "latest" con el ultimo build.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: release-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: esp32-reverse-proxy
      - name: Mover el tag latest al commit actual
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publicar release latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ultimo build (main)
          prerelease: true
          body: Build automatico del ultimo commit de `main` (firmware ESP32). Para versiones fijas crea un tag `vX.Y.Z`.
          files: esp32-reverse-proxy.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
