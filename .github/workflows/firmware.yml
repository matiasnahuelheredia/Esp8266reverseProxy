name: Firmware ESP8266

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [nodemcuv2, esp01_1m]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Compilar
        run: pio run -d firmware -e ${{ matrix.env }}
      - name: Renombrar binario
        run: cp firmware/.pio/build/${{ matrix.env }}/firmware.bin esp8266-reverse-proxy-${{ matrix.env }}.bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: esp8266-reverse-proxy-${{ matrix.env }}.bin
      - name: Publicar en el Release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: esp8266-reverse-proxy-${{ matrix.env }}.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write
