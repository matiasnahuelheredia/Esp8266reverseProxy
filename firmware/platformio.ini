[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.9.0
framework = arduino
board = esp32dev            ; ESP32 clasico (WROOM/WROVER): tiene Bluetooth Classic (SPP)
board_build.partitions = min_spiffs.csv   ; 1.9 MB por app (WiFi+BT ocupan ~1.2 MB) con OTA
monitor_speed = 115200
build_flags =
    -D FW_VERSION=\"2.0.0\"
    -D BT_NAME=\"ESP-Proxy\"
