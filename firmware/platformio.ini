[platformio]
default_envs = nodemcuv2

[env]
platform = espressif8266@4.2.1
framework = arduino
monitor_speed = 115200
build_flags =
    -D FW_VERSION=\"1.0.0\"
    ; Velocidad del UART donde va el modulo Bluetooth (HC-05/HC-06).
    ; Debe coincidir con la configurada en el modulo (ver docs/BLUETOOTH.md).
    -D BT_BAUD=115200
    -D PIO_FRAMEWORK_ARDUINO_LWIP2_HIGHER_BANDWIDTH

; Placa NodeMCU / Wemos D1 mini (4 MB de flash, 1 MB para FS => ~1 MB de firmware OTA)
[env:nodemcuv2]
board = nodemcuv2
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld

; ESP-01S / modulos de 1 MB: solo entra OTA con firmwares < 470 KB
[env:esp01_1m]
board = esp01_1m
board_build.ldscript = eagle.flash.1m64.ld
